[package]
name = "tblgen"
version = "0.1.3"
edition = "2021"
description = "Offline .tbl model metadata spec generator/CLI"
license = "Proprietary"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }

[lib]
name = "tblgen"
path = "src/lib.rs"

[[bin]]
name = "tblgen"
path = "src/main.rs"
