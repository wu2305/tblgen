[package]
name = "tblgen"
version = "0.1.5"
edition = "2021"
description = "Offline .tbl model metadata spec generator/CLI"
license = "Proprietary"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }

[lib]
name = "tblgen"
path = "src/lib.rs"

[[bin]]
name = "tblgen"
path = "src/main.rs"

[[bench]]
name = "wire_check"
harness = false

[[bench]]
name = "cli_timing"
harness = false

[[bench]]
name = "typed_gen"
harness = false
